apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-resources
  namespace: development

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-resources

  template:
    metadata:
      labels:
        app: nginx-resources

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"