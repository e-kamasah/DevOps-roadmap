apiVersion: batch/v1
kind: CronJob

metadata:
  name: hello-cronjob
  namespace: development

spec:
  schedule: "* * * * *"

  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: hello
              image: busybox:latest
              command: ["sh", "-c", "date; echo Hello from my CronJob"]

          restartPolicy: Never