
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: ingress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shop-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: shop-content
          configMap:
            name: shop-page
