apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-health-checks
  namespace: development

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-health-checks

  template:
    metadata:
      labels:
        app: nginx-health-checks

    spec:
      containers:
        - name: nginx
          image: nginx:latest

          ports:
            - containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 3