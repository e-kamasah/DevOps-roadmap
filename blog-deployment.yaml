
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog
  namespace: ingress-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: blog-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: blog-content
          configMap:
            name: blog-page
